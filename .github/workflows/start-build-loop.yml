# Starts "UCLRCDE build loop1" the moment a new batch is added to the plan,
# so builds follow one after another without anyone tapping Run now.
# Owner-approved on 2026-11-04 at 18:36 America/Vancouver ("yes server"), log Entry 0217.
# The key lives only in the repository secret BUILD_LOOP_TOKEN, which only the owner sets.
# This file never prints the key, and it sends nothing but one line of text.
# If the key is missing, the run fails (red) so the owner can see it. Changed 2026-11-04, log Entry 0232.
# Changed 2026-11-05 (log Entry 0270): manual start only. The ChatGPT build task now
# builds after each merge, and Claude is on paid credits, so plan changes no longer
# start this routine (that was the red "startup loop" run on every plan change).
# To use it again: add the push trigger back and save BUILD_LOOP_TOKEN.
name: Start build loop

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: start-build-loop
  cancel-in-progress: false

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Start UCLRCDE build loop1
        env:
          TOKEN: ${{ secrets.BUILD_LOOP_TOKEN }}
          URL: https://api.anthropic.com/v1/claude_code/routines/trig_01WBVCX7NBQNYMU8zFdiKjMk/fire
        run: |
          if [ -z "$TOKEN" ]; then
            echo "BUILD_LOOP_TOKEN is missing, so the build loop was NOT started. Save the key as an Actions secret named BUILD_LOOP_TOKEN."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "anthropic-version: 2026-10-21" \
            -H "Content-Type: application/json" \
            -d "{\"text\": \"Started by the apccs plan update ${GITHUB_SHA}.\"}")
          echo "Build loop answered with HTTP $code."
          if [ "$code" != "200" ]; then exit 1; fi
