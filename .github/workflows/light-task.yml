# Light task: answers a GitHub issue with a free model from GitHub Models, so
# Claude's limited usage is kept for architecture, security decisions and audits.
# Owner-approved on 2026-11-10 at 09:15 America/Vancouver (log Entry 0318, ledger Q028).
# Changed 2026-11-10 at 09:32 (log Entry 0319, ledger Q029): $0 only. No paid API keys;
# it uses GitHub Models' free tier through the built-in GITHUB_TOKEN.
#
# How to use (works from the GitHub phone app):
#   1. Open an issue and write the task in plain words.
#   2. To give it repository files to read, add lines like:  file: plan/QUEUE.md
#   3. Add the label "light" (DeepSeek) or "light-kimi" (Kimi, if GitHub Models has it).
#   The answer arrives as a comment on the issue, usually within a minute.
#
# Limits of the free tier: about 8,000 tokens in and 4,000 out per request, and a
# daily request limit per model. Long files are cut to fit, and the comment says so.
#
# Safety:
# - Runs only when someone with triage rights adds the label (strangers can't).
# - No API keys or secrets. The built-in token can read the repository, comment on
#   issues and call GitHub Models. It cannot push, merge or change files.
# - Never put real case files, keys or personal details in a light task.
name: Light task

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write
  models: read

concurrency:
  group: light-task-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  answer:
    if: github.event.label.name == 'light' || github.event.label.name == 'light-kimi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get the code (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ask the free model and post the answer
        env:
          GH_TOKEN: ${{ github.token }}
          LIGHT_MODEL: ${{ vars.LIGHT_MODEL }}
          KIMI_MODEL: ${{ vars.KIMI_MODEL }}
        run: |
          python3 -I - <<'PY'
          """Light task runner: one issue in, one free-model answer out as a comment.

          Inputs: the issue event (GITHUB_EVENT_PATH), repository files named on
          "file:" lines, GH_TOKEN (the built-in token with models: read), and the
          optional repository variables LIGHT_MODEL and KIMI_MODEL to pin a model.
          Output: one issue comment with the answer, the model and token counts.
          Errors: no model found, a limit reached or a failed call is posted as a
          short comment and the run turns red.
          """
          import json
          import os
          import pathlib
          import re
          import sys
          import urllib.error
          import urllib.request

          MODELS_URL = os.environ.get("MODELS_URL", "https://models.github.ai")
          ROUTES = {
              "light": {
                  "name": "DeepSeek",
                  "pin_env": "LIGHT_MODEL",
                  "prefer": ["deepseek-v4", "deepseek-v3", "deepseek-r1", "deepseek", "gpt-4.1-mini", "gpt-4o-mini"],
              },
              "light-kimi": {
                  "name": "Kimi",
                  "pin_env": "KIMI_MODEL",
                  "prefer": ["kimi"],
              },
          }
          MAX_INPUT_CHARS = 24_000
          MAX_ANSWER_TOKENS = 4000
          SYSTEM = (
              "You help with the APCCS and UCLRCDE software projects. Do the task in the "
              "issue using only the text given. Say plainly when something is missing or "
              "uncertain; never invent facts, sources or test results. Use plain words and "
              "short sentences. Keep the answer under 800 words unless the task asks for more. "
              "Never repeat anything that looks like a key, password or personal detail."
          )

          API = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GH_TOKEN"]
          WORKSPACE = pathlib.Path(os.environ.get("GITHUB_WORKSPACE", ".")).resolve()
          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          issue = event["issue"]
          route = ROUTES[event["label"]["name"]]


          def call(url, payload=None, timeout=60):
              """Send one request with the built-in token; return the parsed JSON."""
              req = urllib.request.Request(
                  url,
                  data=None if payload is None else json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
                  method="GET" if payload is None else "POST",
              )
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  return json.loads(resp.read().decode("utf-8") or "{}")


          def comment(text):
              """Post one comment on the issue."""
              call(f"{API}/repos/{REPO}/issues/{issue['number']}/comments", {"body": text}, timeout=30)


          def stop(text):
              """Report a problem on the issue and turn the run red."""
              comment(f"**Light task not run.** {text}")
              print(text)
              sys.exit(1)


          def pick_model():
              """Return the pinned model, or the best free match from the catalog."""
              pinned = os.environ.get(route["pin_env"], "").strip()
              if pinned:
                  return pinned
              try:
                  catalog = call(f"{MODELS_URL}/catalog/models")
              except (urllib.error.URLError, TimeoutError, ValueError) as err:
                  stop(f"Could not read the GitHub Models list: {err}")
              ids = [m.get("id", "") for m in catalog if isinstance(m, dict)]
              for want in route["prefer"]:
                  found = sorted(i for i in ids if want in i.lower())
                  if found:
                      return found[-1]
              stop(f"GitHub Models has no {route['name']} model right now. Use the label light instead.")


          model = pick_model()

          body = issue.get("body") or ""
          parts, notes, room = [f"TASK: {issue['title']}\n\n{body}"], [], MAX_INPUT_CHARS
          room -= len(parts[0])
          for line in body.splitlines():
              if not line.strip().lower().startswith("file:"):
                  continue
              rel = line.split(":", 1)[1].strip().strip("`")
              path = (WORKSPACE / rel).resolve()
              if WORKSPACE not in path.parents or not path.is_file():
                  notes.append(f"skipped `{rel}`: not a file in this repository")
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              if room <= 500:
                  notes.append(f"skipped `{rel}`: no room left under the free limit")
                  continue
              if len(text) > room:
                  notes.append(f"cut `{rel}` to its first {room:,} of {len(text):,} characters")
                  text = text[:room]
              room -= len(text)
              parts.append(f"--- FILE {rel} ---\n{text}")
          task = "\n\n".join(parts)[: MAX_INPUT_CHARS + 200]

          payload = {
              "model": model,
              "messages": [{"role": "system", "content": SYSTEM}, {"role": "user", "content": task}],
              "max_tokens": MAX_ANSWER_TOKENS,
          }
          try:
              data = call(f"{MODELS_URL}/inference/chat/completions", payload, timeout=300)
          except urllib.error.HTTPError as err:
              if err.code == 429:
                  stop(f"The free daily limit for `{model}` is used up. Try again later.")
              detail = err.read().decode("utf-8", errors="replace")[:300]
              stop(f"GitHub Models answered HTTP {err.code} for `{model}`: {detail}")
          except (urllib.error.URLError, TimeoutError) as err:
              stop(f"Could not reach GitHub Models: {err}")

          try:
              answer = data["choices"][0]["message"]["content"] or ""
          except (KeyError, IndexError, TypeError):
              stop("GitHub Models sent an answer in an unexpected shape.")
          answer = re.sub(r"<think>.*?</think>", "", answer, flags=re.S).strip()
          usage = data.get("usage") or {}
          footer = (
              f"\n\n---\nAnswered free by `{model}` on GitHub Models as a light task. "
              f"Tokens in/out: {usage.get('prompt_tokens', '?')}/{usage.get('completion_tokens', '?')}. "
              f"Files read: {len(parts) - 1}."
          )
          if notes:
              footer += " " + "; ".join(notes) + "."
          footer += " Check it before relying on it."
          comment((answer or "(empty answer)") + footer)
          print(f"Posted answer from {model}: {usage.get('completion_tokens', '?')} tokens.")
          PY
