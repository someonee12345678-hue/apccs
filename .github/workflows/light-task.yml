# Light task: answers a GitHub issue with a small open model, so Claude's limited
# usage is kept for architecture, security decisions and audits.
# Owner-approved on 2026-11-10 at 09:15 America/Vancouver (log Entry 0318, ledger Q028).
# Changed 2026-11-10 at 13:26 (log Entry 0330, ledger Q032): GitHub Models was retired
# on 2026-07-30 and the Gemini API is not free for the Owner, so the light label now
# runs a small open model with Ollama on GitHub's own runner. No key, no outside AI
# service. The light-gemini and light-kimi routes are parked (see ledger Q032).
#
# How to use (works from the GitHub phone app):
#   1. Open an issue and write the task in plain words.
#   2. To give it repository files to read, add lines like:  file: plan/QUEUE.md
#   3. Add the label  light.
#   The answer arrives as a comment on the issue, usually within 3 to 6 minutes.
#
# Settings (repository variables, all optional; only the Owner sets them):
#   OLLAMA_MODEL    the Ollama model tag to use (default qwen3.5:2b; the fallback is
#                   llama3.2:3b if that one can't be downloaded)
#   OLLAMA_VERSION  pin an Ollama version, for example 0.30.0 (default: the newest)
#
# Safety:
# - Runs only when someone with triage rights adds the label (strangers can't).
# - The model runs on the GitHub runner itself. The task text goes only to that
#   runner, which already holds the repository, so nothing reaches an outside AI.
# - The server talks the OpenAI-compatible protocol at http://127.0.0.1:11434/v1, so the
#   model or the server can be swapped without rewriting the runner below.
# - The job can read the repository and comment on issues. It cannot push, merge or
#   change files.
# - Never put real case files, keys or personal details in a light task: the runner is
#   GitHub's computer, not the Owner's device.
# - Each task uses about 3 to 6 of the private repository's free monthly Actions minutes.
name: Light task

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: light-task-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  answer:
    if: github.event.label.name == 'light'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODEL: ${{ vars.OLLAMA_MODEL || 'qwen3.5:2b' }}
      FALLBACK_MODEL: llama3.2:3b
      OLLAMA_VERSION: ${{ vars.OLLAMA_VERSION }}
    steps:
      - name: Note the start time (the answer step keeps inside the 10-minute limit)
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Get the code (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore the cached model
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ env.MODEL }}
          restore-keys: ollama-models-

      - name: Install and start Ollama
        run: |
          url="https://ollama.com/download/ollama-linux-amd64.tar.zst${OLLAMA_VERSION:+?version=$OLLAMA_VERSION}"
          curl -fsSL --retry 3 "$url" | sudo tar --zstd -xf - -C /usr
          ollama --version || true
          mkdir -p "$HOME/.ollama/models"
          # One request at a time; room for about 16,000 characters in plus the answer.
          OLLAMA_MODELS="$HOME/.ollama/models" OLLAMA_CONTEXT_LENGTH=8192 OLLAMA_NUM_PARALLEL=1 \
            OLLAMA_KEEP_ALIVE=30m nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/version && exit 0
            sleep 1
          done
          echo "Ollama did not start:"; tail -n 40 "$RUNNER_TEMP/ollama.log"; exit 1

      - name: Get the model (cached copy first, else download)
        run: |
          chosen=""
          for m in "$MODEL" "$FALLBACK_MODEL"; do
            if ollama show "$m" > /dev/null 2>&1; then
              echo "Using the cached copy of $m"; chosen="$m"; break
            fi
            if timeout 240 ollama pull "$m" > "$RUNNER_TEMP/pull.log" 2>&1; then
              echo "Downloaded $m"; chosen="$m"; break
            fi
            echo "::warning::Could not download $m: $(tail -c 300 "$RUNNER_TEMP/pull.log" | tr '\r\n' '  ')"
          done
          echo "CHOSEN_MODEL=$chosen" >> "$GITHUB_ENV"

      - name: Save the model for next time
        if: steps.restore.outputs.cache-hit != 'true' && env.CHOSEN_MODEL != ''
        uses: actions/cache/save@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ env.CHOSEN_MODEL }}

      - name: Ask the model and post the answer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          """Light task runner: one issue in, one answer from a small open model out.

          Inputs: the issue event (GITHUB_EVENT_PATH), repository files named on
          "file:" lines, GH_TOKEN (built-in token, used only to post the comment),
          CHOSEN_MODEL (the Ollama tag the previous step made ready), JOB_START (job
          start in Unix seconds) and OLLAMA_URL (default http://127.0.0.1:11434/v1;
          any OpenAI-compatible server works).
          Output: one issue comment with the answer, the model, token counts and time.
          Errors: no model, a failed call, a call that would pass the 10-minute limit,
          or an answer in an unexpected shape is posted as a short comment and the run
          turns red.
          """
          import json
          import os
          import pathlib
          import re
          import sys
          import time
          import urllib.error
          import urllib.request

          BASE = os.environ.get("OLLAMA_URL", "http://127.0.0.1:11434/v1").rstrip("/")
          ROUTE = "Ollama on GitHub's runner"
          MAX_CHARS = 16_000          # fits the 8,192-token window set when Ollama starts
          MAX_ANSWER_TOKENS = 1_500
          JOB_LIMIT_S = 600           # matches timeout-minutes: 10 above
          RESERVE_S = 45              # kept back so a failure can still be reported
          SYSTEM = (
              "You help with the APCCS and UCLRCDE software projects. Do the task in the "
              "issue using only the text given. Say plainly when something is missing or "
              "uncertain; never invent facts, sources or test results. Use plain words and "
              "short sentences. Keep the answer under 800 words unless the task asks for more. "
              "Never repeat anything that looks like a key, password or personal detail."
          )

          API = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          REPO = os.environ["GITHUB_REPOSITORY"]
          WORKSPACE = pathlib.Path(os.environ.get("GITHUB_WORKSPACE", ".")).resolve()
          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          issue = event["issue"]
          model = os.environ.get("CHOSEN_MODEL", "").strip()


          def call(url, token, payload=None, timeout=60):
              """Send one request with a bearer token; return the parsed JSON."""
              headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
              if "github" in url:
                  headers["Accept"] = "application/vnd.github+json"
                  headers["X-GitHub-Api-Version"] = "2022-11-28"
              else:
                  headers["Accept"] = "application/json"
              req = urllib.request.Request(
                  url,
                  data=None if payload is None else json.dumps(payload).encode("utf-8"),
                  headers=headers,
                  method="GET" if payload is None else "POST",
              )
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  raw = resp.read().decode("utf-8", errors="replace")
              try:
                  return json.loads(raw or "{}")
              except ValueError:
                  print(f"Not JSON from {url.split('?')[0]}: {raw[:200]!r}")
                  raise


          def comment(text):
              """Post one comment on the issue with the built-in token."""
              call(f"{API}/repos/{REPO}/issues/{issue['number']}/comments",
                   os.environ["GH_TOKEN"], {"body": text}, timeout=30)


          def stop(text):
              """Report a problem on the issue and turn the run red."""
              comment(f"**Light task not run.** {text}")
              print(text)
              sys.exit(1)


          def timed_out(err):
              """True when a request failed because it ran out of time."""
              return isinstance(err, TimeoutError) or isinstance(getattr(err, "reason", None), TimeoutError)


          if not model:
              stop(f"Ollama could not get the model `{os.environ.get('MODEL', '?')}` or the fallback "
                   f"`{os.environ.get('FALLBACK_MODEL', '?')}`. The run log says why. To use another "
                   "model, the Owner sets the repository variable OLLAMA_MODEL to an Ollama tag.")

          body = issue.get("body") or ""
          parts, notes = [f"TASK: {issue['title']}\n\n{body}"], []
          room = MAX_CHARS - len(parts[0])
          for line in body.splitlines():
              if not line.strip().lower().startswith("file:"):
                  continue
              rel = line.split(":", 1)[1].strip().strip("`")
              path = (WORKSPACE / rel).resolve()
              if WORKSPACE not in path.parents or not path.is_file():
                  notes.append(f"skipped `{rel}`: not a file in this repository")
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              if room <= 500:
                  notes.append(f"skipped `{rel}`: no room left under the {MAX_CHARS:,}-character limit")
                  continue
              if len(text) > room:
                  notes.append(f"cut `{rel}` to its first {room:,} of {len(text):,} characters")
                  text = text[:room]
              room -= len(text)
              parts.append(f"--- FILE {rel} ---\n{text}")
          task = "\n\n".join(parts)[: MAX_CHARS + 200]

          payload = {
              "model": model,
              "messages": [{"role": "system", "content": SYSTEM}, {"role": "user", "content": task}],
              "max_tokens": MAX_ANSWER_TOKENS,
              # Answer directly: step-by-step "thinking" is too slow on a runner without a GPU.
              "reasoning_effort": "none",
          }
          started = float(os.environ.get("JOB_START") or time.time())
          too_slow = (f"`{model}` did not finish inside the 10-minute limit. Shorten the task or "
                      "name fewer files, or the Owner sets OLLAMA_MODEL to a smaller model.")
          t0 = time.time()
          data = None
          while data is None:
              budget = JOB_LIMIT_S - RESERVE_S - (time.time() - started)
              if budget < 30:
                  stop(too_slow if time.time() - t0 > 5 else
                       "Setting up Ollama used up the 10-minute limit. Try again: the model is "
                       "cached after its first download, so the next run starts faster.")
              try:
                  data = call(BASE + "/chat/completions", "ollama", payload, timeout=budget)
              except urllib.error.HTTPError as err:
                  detail = err.read().decode("utf-8", errors="replace")[:300]
                  print(f"{model}: HTTP {err.code}: {detail}")
                  if err.code == 400 and "reasoning_effort" in payload:
                      payload.pop("reasoning_effort")  # an older server, or a model without the setting
                      continue
                  stop(f"{ROUTE} answered HTTP {err.code} for `{model}`: {detail}")
              except ValueError:
                  stop(f"{ROUTE} sent an answer that is not JSON.")
              except (urllib.error.URLError, TimeoutError) as err:
                  if timed_out(err):
                      stop(too_slow + f" (Waited {time.time() - t0:.0f} s.)")
                  stop(f"Could not reach {ROUTE}: {err}")
          seconds = time.time() - t0

          try:
              choice = data["choices"][0]
              answer = choice["message"]["content"] or ""
          except (KeyError, IndexError, TypeError):
              stop(f"{ROUTE} sent an answer in an unexpected shape.")
          answer = re.sub(r"<think>.*?</think>", "", answer, flags=re.S).strip()
          if choice.get("finish_reason") == "length":
              notes.append(f"the answer stopped at the {MAX_ANSWER_TOKENS:,}-token limit")
          usage = data.get("usage") or {}
          footer = (
              f"\n\n---\nAnswered free by `{model}` ({ROUTE}; nothing sent to an outside AI) "
              f"as a light task. Tokens in/out: {usage.get('prompt_tokens', '?')}/"
              f"{usage.get('completion_tokens', '?')}. Time: {seconds:.0f} s. Files read: {len(parts) - 1}."
          )
          if notes:
              footer += " " + "; ".join(notes) + "."
          footer += " Check it before relying on it."
          comment((answer or "(empty answer)") + footer)
          print(f"Posted answer from {model}: {usage.get('completion_tokens', '?')} tokens in {seconds:.0f} s.")
          PY
