<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline copy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1>Offline copy</h1>
<p><a href="/">Back to the control panel</a></p>
<p id="status" role="status">Checking.</p>
</header>
<main>
<ol>
<li>Open this page once while the control panel is running.</li>
<li>It keeps a copy of the control panel page on this phone.</li>
<li>After that, the control panel icon opens even when the panel is not running.</li>
</ol>
<p><button type="button" id="keep-now">Keep the control panel for offline use</button></p>
<ul id="kept-list"></ul>
</main>
<script src="screen_offline.js"></script>
</body>
</html>
